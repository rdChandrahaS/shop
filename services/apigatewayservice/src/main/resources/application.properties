server.port=8080
spring.application.name=apigatewayservice

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Gateway routes
spring.cloud.gateway.discovery.locator.enabled=false
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.server.webflux.routes[0].id=orderingservice
spring.cloud.gateway.server.webflux.routes[0].uri=lb://ORDERINGSERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/order,/order/**

spring.cloud.gateway.server.webflux.routes[1].id=paymentservice
spring.cloud.gateway.server.webflux.routes[1].uri=lb://PAYMENTSERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/payment,/payment/**

spring.cloud.gateway.server.webflux.routes[2].id=foodservice
spring.cloud.gateway.server.webflux.routes[2].uri=lb://FOODSERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/foods,/foods/**

spring.cloud.gateway.server.webflux.routes[3].id=authservice
spring.cloud.gateway.server.webflux.routes[3].uri=lb://AUTHSERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/auth,/auth/**

# JWT / internal trust
jwt.secret=${JWT_SECRET}
gateway.internal.secret=${GATEWAY_INTERNAL_SECRET}

# CORS
app.security.cors.allowed-origins[0]=http://localhost:5173
app.security.cors.max-age=3000

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
