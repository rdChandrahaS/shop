services:
  # DATABASES & BROKERS (INFRASTRUCTURE)
  postgres:
    image: postgres:15-alpine
    container_name: shop-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shop_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  mongodb:
    image: mongo:8
    container_name: shop-mongodb
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: shop-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: shop-rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # SPRING BOOT MICROSERVICES
  serviceregistry:
    build: ./serviceregistry
    container_name: serviceregistry
    ports:
      - "${EUREKA_PORT:-8761}:8761"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx256m"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  apigatewayservice:
    build: ./apigatewayservice
    container_name: apigatewayservice
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx256m"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:?GATEWAY_INTERNAL_SECRET is required}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://serviceregistry:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      serviceregistry:
        condition: service_healthy
    restart: unless-stopped

  authservice:
    build: ./authservice
    container_name: authservice
    environment:
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx256m"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://serviceregistry:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SPRING_DATASOURCE_URL: jdbc:postgresql://shop-postgres:5432/shop_db
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
      serviceregistry:
        condition: service_healthy
    restart: unless-stopped

  paymentservice:
    build: ./paymentservice
    container_name: paymentservice
    environment:
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx256m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://shop-postgres:5432/shop_db
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      SPRING_DATA_REDIS_HOST: shop-redis
      SPRING_RABBITMQ_HOST: shop-rabbitmq
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:?GATEWAY_INTERNAL_SECRET is required}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://serviceregistry:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      RAZORPAY_API_KEY: ${RAZORPAY_API_KEY:?RAZORPAY_API_KEY is required}
      RAZORPAY_API_SECRET: ${RAZORPAY_API_SECRET:?RAZORPAY_API_SECRET is required}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:?RAZORPAY_WEBHOOK_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      serviceregistry:
        condition: service_healthy
    restart: unless-stopped

  messageservice:
    build: ./messageservice
    container_name: messageservice
    environment:
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx256m"
      SPRING_RABBITMQ_HOST: shop-rabbitmq
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://serviceregistry:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      rabbitmq:
        condition: service_healthy
      serviceregistry:
        condition: service_healthy
    restart: unless-stopped

  orderingservice:
    build: ./orderingservice
    container_name: orderingservice
    environment:
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx256m"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:?GATEWAY_INTERNAL_SECRET is required}
      SPRING_DATASOURCE_URL: jdbc:postgresql://shop-postgres:5432/shop_db
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      SPRING_DATA_MONGODB_URI: mongodb://shop-mongodb:27017/shop-order
      SPRING_RABBITMQ_HOST: shop-rabbitmq
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://serviceregistry:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      serviceregistry:
        condition: service_healthy
    restart: unless-stopped

  foodservice:
    build: ./foodservice
    container_name: foodservice
    environment:
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx256m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://shop-postgres:5432/shop_db
      SPRING_DATA_REDIS_HOST: shop-redis
      SPRING_RABBITMQ_HOST: shop-rabbitmq
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://serviceregistry:8761/eureka/
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:?GATEWAY_INTERNAL_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      serviceregistry:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  mongodata:
  redisdata:
  rabbitmqdata: