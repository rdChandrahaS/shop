spring.application.name=foodservice
server.port=8089
# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://shop-postgres:5432/shop_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Automatically create/update the tables based on your Java Models
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

eureka.client.serviceUrl.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

# Redis Caching Configuration
spring.cache.type=redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Optional: Set a Time-To-Live (TTL) for the cache so it refreshes automatically (e.g., 1 hour)
spring.cache.redis.time-to-live=36000000

# RabbitMQ
rabbitmq.exchange.name=shop_exchange
rabbitmq.routing.key=food_routing_key
# Requests from the API gateway must carry this shared internal secret
gateway.internal.secret=${GATEWAY_INTERNAL_SECRET}
