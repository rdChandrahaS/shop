syntax = "proto3";
package orderingservice;

option java_package = "com.shop.orderingservice.protobuf";
option java_multiple_files = true;

message PaymentRequestProto {
  string order_id = 1;
  string customer_id = 2;
  double amount = 3;
  string payment_mode = 4;
}

message PaymentResponseProto {
  string order_id = 1;
  string transaction_id = 2;
  bool success = 3;
  string message = 4;
}