spring.application.name=paymentservice

# Set a dedicated port to avoid collisions with port 8080
server.port=8082

# --- Eureka Client Configuration ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# --- PostgreSQL Configuration ---
# Make sure shop_db (or payment_db) exists in your local PostgreSQL!
spring.datasource.url=jdbc:postgresql://localhost:5432/shop_db
spring.datasource.username=postgres
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Razorpay Credentials ---
# Replace these with your actual test keys from the Razorpay Dashboard when ready
razorpay.api.key=rzp_test_yourKeyHere
razorpay.api.secret=yourSecretHere
razorpay.webhook.secret=my_super_secure_webhook_secret_123

# --- Logging Configuration ---
logging.level.root=INFO
logging.level.com.shop.paymentservice=DEBUG

# SQL Logging (For Spring Boot 3+ / Hibernate 6+)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Log File Output
logging.file.name=logs/paymentservice.log

# --- Redis Configuration ---
spring.data.redis.host=localhost
spring.data.redis.port=6379