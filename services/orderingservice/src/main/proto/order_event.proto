syntax = "proto3";
package orderingservice;

option java_package = "com.shop.orderingservice.protobuf";
option java_multiple_files = true;

message PaymentRequestProto {
  string orderId = 1;
  string customerId = 2;
  string amount = 3;
  string paymentMode = 4;
}

message PaymentResponseProto {
  string orderId = 1;
  string transactionId = 2;
  bool success = 3;
  string message = 4;
}

message Food {
  int64 food_id = 1;
  string food_name = 2;
  string food_description = 3;
  string food_price = 4;
  string image_url = 5;
  string category = 6;
  bool active = 7;
}

message FoodEvent {
  enum EventType {
    CREATED = 0;
    UPDATED = 1;
    DELETED = 2;
  }

  EventType event_type = 1;
  Food food = 2;
}

message OrderItemProto {
  string name = 1;
  int32 quantity = 2;
  string price_per_unit = 3;
}

message CustomerProto {
  string name = 1;
  string email = 2;
  string phone_no = 3;
}

message OrderEventProto {
  string order_id = 1;
  string status = 2;
  string message = 3;
  string total_amount = 4;
  CustomerProto customer = 5;
  repeated OrderItemProto items = 6;
}
