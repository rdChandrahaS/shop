spring.application.name=serviceregistry

server.port=8761
server.shutdown=graceful

# Eureka server must not register itself or try to fetch a registry.
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Keep the registry resilient to temporary client/network failures.
eureka.server.enable-self-preservation=true
eureka.server.eviction-interval-timer-in-ms=60000

# Management endpoints.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.info.env.enabled=false

# Prevent accidental exposure of the registry's implementation details.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
