spring.application.name=messageservice

# Give it a unique port (e.g., 8083)
server.port=8083

# Register with Eureka
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# RabbitMQ Connection Properties
# RabbitMQ Connection
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Custom RabbitMQ Queue & Exchange Properties
rabbitmq.queue.name=shop_queue
rabbitmq.exchange.name=shop_exchange
# Make sure this perfectly matches the key in orderingservice!
rabbitmq.routing.key=shop_routing_key

# Optional: Add logging so you can see the Protobuf messages successfully decode!
logging.level.root=INFO
logging.level.com.shop.messageservice=DEBUG

# --- Dead Letter Queue Config ---
rabbitmq.dlx.name=shop_dlx
rabbitmq.dlq.name=shop_dlq
rabbitmq.dlq.routing.key=shop.dlq.routing.key

# --- Enable RabbitMQ listener retries ---
spring.rabbitmq.listener.simple.retry.enabled=true
# Initial wait time between retries (1 second)
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
# Maximum number of retry attempts before rejecting the message
spring.rabbitmq.listener.simple.retry.max-retries=3
# Wait time multiplier (1s -> 2s -> 4s)
spring.rabbitmq.listener.simple.retry.multiplier=2.0