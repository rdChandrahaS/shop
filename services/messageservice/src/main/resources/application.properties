spring.application.name=messageservice

# Give it a unique port (e.g., 8083)
server.port=8083

# Register with Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# RabbitMQ Connection Properties
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Custom RabbitMQ Queue & Exchange Properties
rabbitmq.queue.name=shop_queue
rabbitmq.exchange.name=shop_exchange
# Make sure this perfectly matches the key in orderingservice!
rabbitmq.routing.key=shop_routing_key

# Optional: Add logging so you can see the Protobuf messages successfully decode!
logging.level.root=INFO
logging.level.com.shop.messageservice=DEBUG