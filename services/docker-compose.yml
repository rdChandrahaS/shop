version: '3.8'

services:
  # ==========================================
  # 1. DATABASES & BROKERS (INFRASTRUCTURE)
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: shop-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: shop_db
    ports:
      - "5432:5432"

  mongodb:
    image: mongo:latest
    container_name: shop-mongodb
    ports:
      - "27017:27017"

  redis:
    image: redis:alpine
    container_name: shop-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: shop-rabbitmq
    ports:
      - "5672:5672"   # AMQP protocol port
      - "15672:15672" # Management UI port (http://localhost:15672)

  # ==========================================
  # 2. SPRING BOOT MICROSERVICES
  # ==========================================
  serviceregistry:
    build: ./serviceregistry
    container_name: serviceregistry
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 10s
      retries: 5

  apigatewayservice:
    build: ./apigatewayservice
    container_name: apigatewayservice
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://serviceregistry:8761/eureka/
    depends_on:
      - serviceregistry

  authservice:
    build: ./authservice
    container_name: authservice
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/shop_db
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://serviceregistry:8761/eureka/
    depends_on:
      - postgres
      - serviceregistry

  paymentservice:
    build: ./paymentservice
    container_name: paymentservice
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/shop_db
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_RABBITMQ_HOST=rabbitmq
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://serviceregistry:8761/eureka/
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - serviceregistry

  foodservice:
    build: ./foodservice
    container_name: foodservice
    ports:
      - "8083:8083" # Assuming 8083 is available!
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/shop_db
      - SPRING_DATA_REDIS_HOST=redis
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://serviceregistry:8761/eureka/
    depends_on:
      - postgres
      - redis
      - serviceregistry

  orderingservice:
    build: ./orderingservice
    container_name: orderingservice
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/shop_db
      - SPRING_MONGODB_URI=mongodb://mongodb:27017/shop-order
      - SPRING_RABBITMQ_HOST=rabbitmq
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://serviceregistry:8761/eureka/
    depends_on:
      - postgres
      - mongodb
      - rabbitmq
      - serviceregistry
